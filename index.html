<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Age Calculator Pro</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 20px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    color: white;
    background: linear-gradient(135deg,#071b33,#087e8b,#12a89d);
}

.container {
    width: 100%;
    max-width: 480px;
    margin: 20px auto;
    padding: 24px;
    border-radius: 24px;
    background: rgba(255,255,255,.12);
    border: 1px solid rgba(255,255,255,.25);
    box-shadow: 0 15px 40px #00152255;
}

h1 {
    text-align: center;
    font-size: 29px;
    margin-bottom: 8px;
}

.subtitle {
    text-align: center;
    color: #d6f4f5;
    margin-bottom: 28px;
}

label {
    display: block;
    font-weight: bold;
    margin-bottom: 10px;
}

input {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 12px;
    font-size: 16px;
    margin-bottom: 16px;
}

button {
    border: 0;
    border-radius: 11px;
    padding: 13px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.main-btn {
    width: 100%;
    background: #25d9b1;
    color: #05313b;
    font-size: 17px;
}

.buttons {
    display: flex;
    gap: 9px;
    margin-top: 12px;
}

.buttons button {
    flex: 1;
}

.clear-btn {
    background: #ffca70;
    color: #392500;
}

.copy-btn {
    background: #d8eaff;
    color: #123b68;
}

.reset-btn {
    background: #ffd7d7;
    color: #782020;
}

#result {
    display: none;
    margin-top: 24px;
}

.age-box {
    padding: 20px 12px;
    text-align: center;
    background: #052f40a8;
    border-radius: 16px;
    margin-bottom: 18px;
}

.age-number {
    color: #64ffda;
    font-size: 23px;
    font-weight: bold;
    line-height: 1.7;
    overflow-wrap: anywhere;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
}

.item {
    padding: 15px 8px;
    background: #ffffff17;
    border: 1px solid #ffffff25;
    border-radius: 13px;
    text-align: center;
    overflow-wrap: anywhere;
}

.item span {
    display: block;
    font-size: 13px;
    color: #d5eeee;
    margin-bottom: 9px;
}

.item strong {
    font-size: 19px;
    color: #64ffda;
}

.birthday {
    margin-top: 15px;
    padding: 15px;
    text-align: center;
    background: #25d9b122;
    border-radius: 13px;
    line-height: 1.7;
}

#error {
    text-align: center;
    color: #ffd0d0;
    margin-top: 12px;
}

footer {
    text-align: center;
    font-size: 12px;
    margin-top: 25px;
    color: #d6f4f5;
}
</style>
</head>

<body>

<div class="container">

    <h1>🎂 Age Calculator Pro</h1>
    <p class="subtitle">Discover every detail of your age!</p>

    <label for="dob">Select Date of Birth</label>
    <input type="date" id="dob">

    <button class="main-btn" onclick="calculateAge()">
        Calculate My Age
    </button>

    <div class="buttons">
        <button class="clear-btn" onclick="clearDate()">🧹 Clear</button>
        <button class="copy-btn" onclick="copyResult()">📋 Copy</button>
        <button class="reset-btn" onclick="resetAll()">🔄 Reset</button>
    </div>

    <p id="error"></p>

    <div id="result">

        <div class="age-box">
            <p>Your Exact Age</p>
            <div class="age-number" id="age"></div>
        </div>

        <div class="grid">
            <div class="item">
                <span>Total Years</span>
                <strong id="years"></strong>
            </div>

            <div class="item">
                <span>Total Months</span>
                <strong id="months"></strong>
            </div>

            <div class="item">
                <span>Total Weeks</span>
                <strong id="weeks"></strong>
            </div>

            <div class="item">
                <span>Total Days</span>
                <strong id="days"></strong>
            </div>

            <div class="item">
                <span>Next Birthday</span>
                <strong id="nextDate"></strong>
            </div>

            <div class="item">
                <span>Weekday Born</span>
                <strong id="weekday"></strong>
            </div>
        </div>

        <div class="birthday" id="birthday"></div>

        <p style="text-align:center;font-size:12px;color:#d6f4f5">
            Total hours are estimated from calendar days.
        </p>

    </div>

    <footer>Made with ❤️ by Sifat</footer>

</div>

<script>
const dob = document.getElementById("dob");
const result = document.getElementById("result");
const error = document.getElementById("error");

function dateOnly(date) {
    return new Date(
        date.getFullYear(),
        date.getMonth(),
        date.getDate()
    );
}

function calculateAge() {
    error.textContent = "";
    result.style.display = "none";

    if (!dob.value) {
        error.textContent = "Please select your date of birth.";
        return;
    }

    const birth = new Date(dob.value + "T00:00:00");
    const now = new Date();
    const today = dateOnly(now);

    if (birth > today) {
        error.textContent = "Date of birth cannot be in the future.";
        return;
    }

    let years = today.getFullYear() - birth.getFullYear();
    let months = today.getMonth() - birth.getMonth();
    let days = today.getDate() - birth.getDate();

    if (days < 0) {
        months--;
        days += new Date(
            today.getFullYear(),
            today.getMonth(),
            0
        ).getDate();
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    const totalDays = Math.floor(
        (today - birth) / 86400000
    );

    document.getElementById("age").textContent =
        years + " Years, " + months + " Months, " + days + " Days";

    document.getElementById("years").textContent = years;
    document.getElementById("months").textContent =
        years * 12 + months;
    document.getElementById("weeks").textContent =
        Math.floor(totalDays / 7);
    document.getElementById("days").textContent = totalDays;

    document.getElementById("weekday").textContent =
        birth.toLocaleDateString("en-US", { weekday: "long" });

    let nextBirthday = new Date(
        today.getFullYear(),
        birth.getMonth(),
        birth.getDate()
    );

    if (nextBirthday < today) {
        nextBirthday = new Date(
            today.getFullYear() + 1,
            birth.getMonth(),
            birth.getDate()
        );
    }

    const daysLeft = Math.round(
        (nextBirthday - today) / 86400000
    );

    document.getElementById("nextDate").textContent =
        nextBirthday.toLocaleDateString("en-US", {
            day: "numeric",
            month: "short",
            year: "numeric"
        });

    document.getElementById("birthday").textContent =
        daysLeft === 0
        ? "🎉 Happy Birthday! Today is your birthday!"
        : "🎈 " + daysLeft + " days until your next birthday!";

    result.style.display = "block";
}

function clearDate() {
    dob.value = "";
    error.textContent = "";
    result.style.display = "none";
}

function resetAll() {
    dob.value = "";
    error.textContent = "";
    result.style.display = "none";
}

function copyResult() {
    if (result.style.display === "none") {
        error.textContent = "Calculate your age first!";
        return;
    }

    const text =
        "AGE CALCULATOR PRO\n" +
        "Exact Age: " + document.getElementById("age").textContent + "\n" +
        "Total Months: " + document.getElementById("months").textContent + "\n" +
        "Total Weeks: " + document.getElementById("weeks").textContent + "\n" +
        "Total Days: " + document.getElementById("days").textContent + "\n" +
        "Born On: " + document.getElementById("weekday").textContent + "\n" +
        "Next Birthday: " + document.getElementById("nextDate").textContent + "\n" +
        document.getElementById("birthday").textContent;

    if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text)
            .then(() => {
                error.style.color = "#64ffda";
                error.textContent = "Age details copied successfully!";
            })
            .catch(() => fallbackCopy(text));
    } else {
        fallbackCopy(text);
    }
}

function fallbackCopy(text) {
    const area = document.createElement("textarea");
    area.value = text;
    area.style.position = "fixed";
    area.style.left = "-9999px";
    document.body.appendChild(area);
    area.select();

    try {
        const success = document.execCommand("copy");
        error.style.color = success ? "#64ffda" : "#ffd0d0";
        error.textContent = success
            ? "Age details copied successfully!"
            : "Copy failed. Please select and copy the details manually.";
    } catch (e) {
        error.style.color = "#ffd0d0";
        error.textContent = "Copy failed. Please try again.";
    }

    area.remove();
}

dob.max = [
    new Date().getFullYear(),
    String(new Date().getMonth() + 1).padStart(2, "0"),
    String(new Date().getDate()).padStart(2, "0")
].join("-");
</script>

</body>
</html>
